substitutions:
  _REGION: us-central1
  _ZONE: us-central1-a
  _VM_NAME: two-tier-vm
  _REPOSITORY: flask-app
  _SSH_USER: ubuntu

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/flask-app:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/flask-app:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/flask-app

  - name: gcr.io/cloud-builders/gcloud
    id: prepare-vm
    args:
      - compute
      - ssh
      - --quiet
      - --zone=${_ZONE}
      - ${_SSH_USER}@${_VM_NAME}
      - --command=mkdir -p ~/app

  - name: gcr.io/cloud-builders/gcloud
    id: copy-files
    args:
      - compute
      - scp
      - --quiet
      - --zone=${_ZONE}
      - docker-compose.yml
      - scripts/deploy-on-vm.sh
      - ${_SSH_USER}@${_VM_NAME}:~/app/

  - name: gcr.io/cloud-builders/gcloud
    id: deploy
    entrypoint: bash
    args:
      - -c
      - |
        gcloud compute ssh ${_SSH_USER}@${_VM_NAME} --zone=${_ZONE} --quiet --command="
          set -e
          chmod +x ~/app/deploy-on-vm.sh
          REGION=${_REGION} IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/flask-app:$COMMIT_SHA ~/app/deploy-on-vm.sh
        "

options:
  logging: CLOUD_LOGGING_ONLY
